<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebDropper Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b0b0b; color: #f0f0f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login { background: #1a1a1a; padding: 40px; border-radius: 20px; width: 350px; box-shadow: 0 0 30px rgba(0, 150, 255, 0.1); border: 1px solid #2a2a2a; }
        h2 { text-align: center; margin-bottom: 30px; color: #00bfff; font-weight: 300; letter-spacing: 2px; }
        input { width: 100%; padding: 12px; background: #0d0d0d; border: 1px solid #333; color: #fff; border-radius: 8px; margin: 10px 0; outline: none; transition: 0.3s; }
        input:focus { border-color: #00bfff; }
        button { width: 100%; padding: 14px; background: #00bfff; border: none; border-radius: 10px; color: #0b0b0b; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0099cc; transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="login">
        <h2>WebDropper</h2>
        <form method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
